cluster: "bsub -J 'rule={rule},wilcards={wildcards.sample},jobid={jobid}' -M {cluster.mem} -n {threads} -W {cluster.time} -o 'logs/cluster/%J.log' -e 'logs/cluster/%J.err' -R 'select[mem>{cluster.mem}] rusage[mem={cluster.mem}]' {cluster.host}  -q {cluster.queue}"
cluster-config: "pipelines/nrsearch/1.0.0/profiles/lsf/cluster.yaml"
jobs: 1000
latency-wait: 90
use-singularity: false
singularity-args: "--net --network none --nv -B $(pwd) -B /rsrch4:/rsrch4  -B /rsrch5:/rsrch5 -B /rsrch6:/rsrch6 -B /rsrch9:/rsrch9 -B /rsrch6/home/hema_bio-Malignan/adp_shukla/pipeline_resources/alphafold3/data/params:/data/models -B /rsrch6/home/hema_bio-Malignan/adp_shukla/pipeline_resources/alphafold3/public_databases:/data/public_databases"
printshellcmds: true
keep-going: true
retries: 0
shadow-prefix: "/tmp"